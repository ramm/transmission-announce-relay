[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transmission-announce-relay"
version = "0.1.3"
description = "Local announce relay for Transmission: fresh verified HTTPS connection per announce, hedged stalls, bounded retry. Standard library only."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}  # table form: builds with setuptools 61+ (Python 3.8 support)
keywords = ["transmission", "bittorrent", "tracker", "announce", "relay", "proxy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: No Input/Output (Daemon)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: File Sharing",
  "Topic :: Internet :: Proxy Servers",
]

[project.urls]
Homepage = "https://github.com/ramm/transmission-announce-relay"
Issues = "https://github.com/ramm/transmission-announce-relay/issues"

[project.scripts]
transmission-announce-relay = "transmission_announce_relay.relay:main"
tar-ctl = "transmission_announce_relay.ctl:main"

[tool.setuptools]
packages = ["transmission_announce_relay"]
